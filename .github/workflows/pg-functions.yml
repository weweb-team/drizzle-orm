name: PostgreSQL routine migrations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pg-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Kit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm lint
      - name: Build ORM runtime
        run: pnpm --filter drizzle-orm build
      - name: Run PostgreSQL schema diff unit tests
        run: >-
          pnpm --filter @weweb/drizzle-kit exec vitest run
          tests/pg-enums.test.ts tests/pg-schemas.test.ts tests/pg-tables.test.ts
          tests/pg-columns.test.ts tests/pg-views.test.ts tests/pg-sequences.test.ts
          tests/pg-array.test.ts
          tests/pg-array-defaults.codegen.test.ts
          tests/pg-array-defaults.compare.test.ts
          tests/safeRecord.test.ts tests/safeJsonDiff.test.ts
          tests/mysql-generated.test.ts tests/mysql-schemas.test.ts
          tests/sqlite-generated.test.ts tests/sqlite-columns.test.ts

  migrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 18]
    services:
      postgres:
        image: pgvector/pgvector:pg${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drizzle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d drizzle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DRIZZLE_FUNCTION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drizzle_test
      DRIZZLE_FUNCTION_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build ORM runtime
        run: pnpm --filter drizzle-orm build
      - name: Typecheck Kit
        run: pnpm --filter @weweb/drizzle-kit tsc
      - name: Run PostgreSQL and pgvector migration regressions
        run: >-
          pnpm --filter @weweb/drizzle-kit exec vitest run
          tests/pg-functions.test.ts tests/pg-array-defaults.postgres.test.ts tests/pg-identifiers.test.ts
          tests/pg-array-defaults.codegen.test.ts
      - name: Build distributable Kit package
        run: pnpm --filter @weweb/drizzle-kit build
      - name: Run regressions against the built CommonJS and ESM APIs
        env:
          DRIZZLE_FUNCTION_TEST_PACKAGE: '1'
        run: pnpm --filter @weweb/drizzle-kit exec vitest run tests/pg-functions.package.test.ts
